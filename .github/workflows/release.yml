name: Clean Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-firmware:
    name: Build Pico Firmware (RP2040)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Cache xPack arm-none-eabi-gcc
        id: cache-arm-gcc
        uses: actions/cache@v4
        with:
          path: ~/.local/arm-gcc
          key: xpack-arm-none-eabi-gcc-15.2.1-1.1-linux-x64

      - name: Install xPack arm-none-eabi-gcc (v15.2.1-1.1)
        if: steps.cache-arm-gcc.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/arm-gcc"
          curl -fsSL --retry 5 --retry-delay 3 \
            "https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v15.2.1-1.1/xpack-arm-none-eabi-gcc-15.2.1-1.1-linux-x64.tar.gz" \
            -o /tmp/arm-gcc.tar.gz
          echo "da6a49ad4003944b823c6c93702a8787c922ab34bd7e918ec0eaf6933a9b1ff6  /tmp/arm-gcc.tar.gz" | sha256sum -c -
          tar -xzf /tmp/arm-gcc.tar.gz -C "$HOME/.local/arm-gcc"
          rm -f /tmp/arm-gcc.tar.gz

      - name: Add arm-none-eabi-gcc to PATH
        run: |
          echo "$HOME/.local/arm-gcc/xpack-arm-none-eabi-gcc-15.2.1-1.1/bin" >> "$GITHUB_PATH"
          "$HOME/.local/arm-gcc/xpack-arm-none-eabi-gcc-15.2.1-1.1/bin/arm-none-eabi-gcc" --version

      - name: Checkout Pico SDK 2.3.1 (with TinyUSB submodule)
        uses: actions/checkout@v7
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.3.1
          path: pico-sdk
          submodules: recursive
          persist-credentials: false

      - name: Build and install picotool 2.3.1 (no apt required)
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: |
          git clone --depth 1 --branch 2.3.1 "https://github.com/raspberrypi/picotool.git" /tmp/picotool
          cmake -S /tmp/picotool -B /tmp/picotool/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPICOTOOL_NO_LIBUSB=1 \
            -DCMAKE_INSTALL_PREFIX="$HOME/.local"
          cmake --build /tmp/picotool/build -j"$(nproc)"
          cmake --install /tmp/picotool/build
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "picotool_DIR=$HOME/.local/lib/cmake/picotool" >> "$GITHUB_ENV"

      - name: Build gamepad_firmware.uf2
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: |
          cmake -S firmware -B firmware/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPICO_BOARD=pico \
            -DPICO_PLATFORM=rp2040
          cmake --build firmware/build -j"$(nproc)"
          test -s firmware/build/gamepad_firmware.uf2
          ls -lh firmware/build/gamepad_firmware.uf2

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: pico-firmware
          path: firmware/build/gamepad_firmware.uf2
          if-no-files-found: error
          retention-days: 7

  build-and-release:
    name: Test, Build PC App and Create Draft Release
    needs: build-firmware
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Download Pico firmware artifact
        uses: actions/download-artifact@v8
        with:
          name: pico-firmware
          path: artifacts/pico

      - name: Run unit tests (Quality Gate)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet test pc_app/tests/GamepadEmulator.Tests.csproj -c Release `
            --blame-hang-timeout 5m `
            --logger "trx;LogFileName=test-results.trx" `
            --results-directory TestResults

      - name: Publish self-contained PicoPad (win-x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet publish pc_app/src/GamepadEmulator.csproj -c Release -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:PublishTrimmed=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o dist/publish/win-x64
          if (-not (Test-Path "dist/publish/win-x64/PicoPad.exe")) {
            throw "PicoPad.exe の生成確認に失敗しました。"
          }

      - name: Create Clean ZIP and SHA-256 Checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tagName = $env:GITHUB_REF_NAME
          $zipName = "PicoPad_${tagName}.zip"

          New-Item -ItemType Directory -Force -Path "dist/package" | Out-Null

          Copy-Item -Path "dist/publish/win-x64/*" -Destination "dist/package/" -Recurse -Force
          Copy-Item -Path "artifacts/pico/gamepad_firmware.uf2" -Destination "dist/package/gamepad_firmware.uf2" -Force
          Copy-Item -Path "README.md" -Destination "dist/package/README.md" -Force
          Copy-Item -Path "LICENSE" -Destination "dist/package/LICENSE" -Force
          Copy-Item -Path "pc_app/src/Resources/Images/SOURCES.md" -Destination "dist/package/SOURCES.md" -Force

          Get-ChildItem -Path "dist/package" -Include "*.pdb", "*.cs", "profiles.json" -Recurse | Remove-Item -Force

          Compress-Archive -Path "dist/package/*" -DestinationPath "dist/$zipName" -Force

          $zipHash = (Get-FileHash "dist/$zipName" -Algorithm SHA256).Hash.ToLower()
          $uf2Hash = (Get-FileHash "dist/package/gamepad_firmware.uf2" -Algorithm SHA256).Hash.ToLower()
          @(
            "$zipHash  $zipName",
            "$uf2Hash  gamepad_firmware.uf2"
          ) | Set-Content -Path "dist/checksums.txt" -Encoding ascii

      - name: Create Draft GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/PicoPad_*.zip
            dist/checksums.txt
